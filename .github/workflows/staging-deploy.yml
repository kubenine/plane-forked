name: Staging deploy

# Manual deploy of the selected ref onto the Helm release already running in the cluster.
# Does not run on pull requests, so fork PRs cannot read the kubeconfig or registry secrets.

on:
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and helm upgrade
    runs-on: ${{ vars.STAGING_RUNNER_LABEL }}
    timeout-minutes: 180
    environment: staging
    env:
      STAGING_NAMESPACE: ${{ vars.STAGING_NAMESPACE }}
      STAGING_HELM_RELEASE: ${{ vars.STAGING_HELM_RELEASE }}
      STAGING_HELM_REPO_URL: ${{ vars.STAGING_HELM_REPO_URL }}
      STAGING_HELM_CHART: ${{ vars.STAGING_HELM_CHART }}
      STAGING_HELM_CHART_VERSION: ${{ vars.STAGING_HELM_CHART_VERSION }}
      STAGING_IMAGE_NAMESPACE: ${{ vars.STAGING_IMAGE_NAMESPACE }}
      BUILD_PLATFORM: ${{ vars.BUILD_PLATFORM }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --source . --no-git --redact --verbose --exit-code 1

      - name: Validate deploy settings
        run: |
          set -euo pipefail
          missing=0
          for name in STAGING_NAMESPACE STAGING_HELM_RELEASE STAGING_HELM_REPO_URL STAGING_HELM_CHART STAGING_IMAGE_NAMESPACE BUILD_PLATFORM; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub variable: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        run: |
          set -euo pipefail
          images=(
            "web|.|./apps/web/Dockerfile.web"
            "admin|.|./apps/admin/Dockerfile.admin"
            "space|.|./apps/space/Dockerfile.space"
            "live|.|./apps/live/Dockerfile.live"
            "api|./apps/api|./apps/api/Dockerfile.api"
          )
          for spec in "${images[@]}"; do
            IFS='|' read -r name context file <<<"$spec"
            tag="${STAGING_IMAGE_NAMESPACE}/plane-${name}:${IMAGE_TAG}"
            echo "Building ${tag}"
            docker buildx build --push --platform "$BUILD_PLATFORM" --file "$file" --tag "$tag" "$context"
          done

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4

      - name: Configure kubeconfig (in-cluster, scoped SA token)
        env:
          SA_TOKEN: ${{ secrets.STAGING_DEPLOYER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SA_TOKEN" ]; then
            echo "Missing secret STAGING_DEPLOYER_TOKEN"
            exit 1
          fi
          kubectl config set-cluster in-cluster \
            --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" \
            --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          kubectl config set-credentials staging-deployer --token="${SA_TOKEN}"
          kubectl config set-context staging \
            --cluster=in-cluster \
            --user=staging-deployer \
            --namespace="$STAGING_NAMESPACE"
          kubectl config use-context staging
          kubectl auth whoami

      - name: Render image values
        run: |
          set -euo pipefail
          python3 -c 'import os; from pathlib import Path; t = Path("deploy/staging/image-values.yaml").read_text(); t = t.replace("__IMAGE_REPO_PREFIX__", os.environ["STAGING_IMAGE_NAMESPACE"] + "/plane").replace("__IMAGE_TAG__", os.environ["IMAGE_TAG"]); Path("/tmp/image-values.yaml").write_text(t)'

      - name: Helm upgrade
        run: |
          set -euo pipefail
          if ! helm status "$STAGING_HELM_RELEASE" --namespace "$STAGING_NAMESPACE" >/dev/null 2>&1; then
            echo "Helm release ${STAGING_HELM_RELEASE} was not found in namespace ${STAGING_NAMESPACE}."
            echo "Refusing to create a new release from image overrides alone."
            exit 1
          fi
          helm repo add deploy-repo "$STAGING_HELM_REPO_URL"
          helm repo update deploy-repo
          args=(
            upgrade
            --install
            "$STAGING_HELM_RELEASE"
            "deploy-repo/${STAGING_HELM_CHART}"
            --namespace "$STAGING_NAMESPACE"
            --reuse-values
            --values /tmp/image-values.yaml
            --wait
            --wait-for-jobs
            --timeout 10m
            --atomic
          )
          if [ -n "$STAGING_HELM_CHART_VERSION" ]; then
            args+=(--version "$STAGING_HELM_CHART_VERSION")
          fi
          helm "${args[@]}"

      - name: Wait for rollouts
        run: |
          set -euo pipefail
          mapfile -t deployments < <(
            kubectl get deploy --namespace "$STAGING_NAMESPACE" -o json |
              jq -r --arg release "$STAGING_HELM_RELEASE" '
                .items[]
                | select(.metadata.annotations["meta.helm.sh/release-name"] == $release)
                | .metadata.name
              '
          )
          if [ "${#deployments[@]}" -eq 0 ]; then
            echo "No Deployments found for Helm release ${STAGING_HELM_RELEASE} in ${STAGING_NAMESPACE}"
            exit 1
          fi
          for name in "${deployments[@]}"; do
            echo "Waiting for deployment/${name}"
            kubectl rollout status "deployment/${name}" --namespace "$STAGING_NAMESPACE" --timeout=10m
          done
