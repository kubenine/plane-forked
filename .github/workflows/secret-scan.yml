name: Secret scan

# Fails when a commit exposes credentials.
# Uses the gitleaks binary directly. gitleaks-action requires a paid license
# for GitHub organizations, and this repository is a public fork.
# Also turn on GitHub secret scanning and push protection in the repository
# settings. Those are repository settings, not workflow YAML.

on:
  pull_request:
    branches:
      - staging
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "${BASE_SHA}" || true
            fi
          fi
          if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            gitleaks detect --source . --redact --verbose --exit-code 1 --log-opts="${BASE_SHA}..${HEAD_SHA}"
          else
            gitleaks detect --source . --no-git --redact --verbose --exit-code 1
          fi
