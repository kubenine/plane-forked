name: Security scan

# Dependency (OSV) and filesystem/IaC (Trivy) scans.
# Runs on GitHub-hosted runners only: this is a public repository, so pull
# request code must never execute on the self-hosted cluster runners.

on:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          version=2.6.0
          base="https://github.com/google/osv-scanner/releases/download/v${version}"
          curl -sSfL "${base}/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          curl -sSfL "${base}/osv-scanner_SHA256SUMS" -o /tmp/osv-scanner_SHA256SUMS
          (cd /tmp && grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sed 's/osv-scanner_linux_amd64/osv-scanner/' | sha256sum -c -)
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      # Informational until the existing findings are triaged; drop
      # continue-on-error to make new advisories block the build.
      - name: Scan lockfiles
        continue-on-error: true
        run: |
          osv-scanner scan source \
            --lockfile pnpm-lock.yaml \
            --lockfile requirements.txt:apps/api/requirements/base.txt

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Report HIGH findings (non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Fail on CRITICAL findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
