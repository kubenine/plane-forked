# Non-secret image overrides for the existing staging Helm release.
# The deploy workflow substitutes the placeholders below before `helm upgrade`.
# The chart renders each image as "<component>.image:<planeVersion>", so `image`
# holds the repository only and `planeVersion` carries the tag shared by all components.
# worker and beatworker reuse the API image.
planeVersion: __IMAGE_TAG__
web:
  image: __IMAGE_REPO_PREFIX__-web
space:
  image: __IMAGE_REPO_PREFIX__-space
admin:
  image: __IMAGE_REPO_PREFIX__-admin
live:
  image: __IMAGE_REPO_PREFIX__-live
api:
  image: __IMAGE_REPO_PREFIX__-api
worker:
  image: __IMAGE_REPO_PREFIX__-api
beatworker:
  image: __IMAGE_REPO_PREFIX__-api
